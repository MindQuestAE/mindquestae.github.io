name: Deploy to GitHub Pages with Optimization

on:
  push:
    branches: [ main, master ]
  # Manual deploy from the Actions tab (pick main or master)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # delete the Pages artifact after deploying

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install -g html-minifier-terser
        npm install -g clean-css-cli
        npm install -g terser

    - name: Optimize HTML
      run: |
        mkdir -p ./dist/docs
        html-minifier-terser ./index.html --output ./dist/index.html \
          --remove-comments \
          --remove-redundant-attributes \
          --remove-script-type-attributes \
          --remove-style-link-type-attributes \
          --use-short-doctype \
          --minify-css true \
          --minify-js true \
          --collapse-whitespace
        html-minifier-terser ./ad.html --output ./dist/ad.html \
          --remove-comments \
          --remove-redundant-attributes \
          --remove-script-type-attributes \
          --remove-style-link-type-attributes \
          --use-short-doctype \
          --minify-css true \
          --minify-js true \
          --collapse-whitespace
        html-minifier-terser ./docs/2026-design.html --output ./dist/docs/2026-design.html \
          --remove-comments \
          --remove-redundant-attributes \
          --remove-script-type-attributes \
          --remove-style-link-type-attributes \
          --use-short-doctype \
          --minify-css true \
          --minify-js true \
          --collapse-whitespace

    - name: Copy static assets
      run: |
        mkdir -p ./dist/assets ./dist/widget
        cp -R ./assets/. ./dist/assets/
        cp ./widget/mq-widget.v1.js ./dist/widget/
        cp ./robots.txt ./sitemap.xml ./CNAME ./dist/
        find ./dist -name '.DS_Store' -delete

    - name: Optimize CSS
      run: |
        mkdir -p ./dist/assets
        cleancss -o ./dist/assets/styles.css ./assets/styles.css

    - name: Optimize JavaScript
      run: |
        terser ./assets/script.js -o ./dist/assets/script.js --compress --mangle
        terser ./sw.js -o ./dist/sw.js --compress --mangle

    - name: Verify all local references are deployed
      run: |
        python3 scripts/verify_dist.py \
          --root ./dist \
          --html index.html ad.html docs/2026-design.html \
          --service-worker-source ./sw.js \
          --script-source ./assets/script.js \
          --site-domain mindquestquiz.com

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      id: upload
      uses: actions/upload-pages-artifact@v4
      with:
        path: './dist'
        # One artifact per attempt, so "Re-run jobs" does not find duplicates
        name: github-pages-${{ github.run_attempt }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}

    - name: Delete the Pages artifact
      if: always() && steps.upload.outputs.artifact_id
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.upload.outputs.artifact_id }}"
